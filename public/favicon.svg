<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" stroke="#0284c7" stroke-width="3"/>
  <!-- Rainbow arc -->
  <path d="M 15 50 A 35 35 0 0 1 85 50" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.8"/>
  <path d="M 19 50 A 31 31 0 0 1 81 50" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.8"/>
  <path d="M 23 50 A 27 27 0 0 1 77 50" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.8"/>
  <!-- Sheep fluffy cloud body -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
    <circle cx="35" cy="55" r="14"/>
    <circle cx="65" cy="55" r="14"/>
    <circle cx="50" cy="45" r="15"/>
    <circle cx="42" cy="65" r="12"/>
    <circle cx="58" cy="65" r="12"/>
    <circle cx="50" cy="58" r="16"/>
  </g>
  <!-- Sheep head -->
  <ellipse cx="50" cy="54" rx="12" ry="10" fill="#fdf2f8"/>
  <!-- Cute ears -->
  <ellipse cx="37" cy="48" rx="5" ry="3" fill="#f472b6" transform="rotate(-20 37 48)"/>
  <ellipse cx="63" cy="48" rx="5" ry="3" fill="#f472b6" transform="rotate(20 63 48)"/>
  <!-- Rosy cheeks -->
  <circle cx="43" cy="56" r="2.5" fill="#f472b6" opacity="0.6"/>
  <circle cx="57" cy="56" r="2.5" fill="#f472b6" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="45" cy="52" r="2" fill="#1e293b"/>
  <circle cx="45.6" cy="51.4" r="0.8" fill="#ffffff"/>
  <circle cx="55" cy="52" r="2" fill="#1e293b"/>
  <circle cx="55.6" cy="51.4" r="0.8" fill="#ffffff"/>
  <!-- Smiling mouth -->
  <path d="M 48 57 Q 50 60 52 57" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round"/>
</svg>
